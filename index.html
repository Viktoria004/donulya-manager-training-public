/characters/evgeniy-sidorov.jpeg`,position:`50% 38%`},nikita:{name:`Никита`,role:`Руководитель отдела продаж`,note:`Сроки после подписи — это работа менеджера, а не ожидание оплаты.`,image:`/characters/nikita-head-of-sales.webp`,position:`50% 28%`},alena:{name:`Алёна`,role:`Менеджер`,note:`Частичный платёж — не финал: клиенту всё ещё нужна помощь с полной суммой.`,image:`/characters/alena-sales-manager.webp`,position:`50% 28%`},victoria:{name:`Виктория`,role:`Операционный директор`,note:`После полной оплаты важно быстро передать клиента дальше и ничего не потерять.`,image:`/characters/victoria-operations-director.webp`,position:`50% 28%`}},E=[{name:`Алёна`,image:`/characters/alena-sales-manager.webp`},{name:`Камран`,image:`/characters/kamran-sales-manager.webp`},{name:`Никита`,image:`/characters/nikita-head-of-sales.webp`},{name:`Владислав`,image:`/characters/vladislav-sales-manager.webp`},{name:`Виктория`,image:`/characters/victoria-operations-director.webp`},{name:`Максим`,image:`/characters/maxim-company-owner.webp`},{name:`Руслан`,image:`/characters/ruslan-company-owner.webp`}],ne=[{code:`ST01`,label:`Новый лид`,when:`Заявка назначена; живого контакта ещё не было.`,sla:`Первый исходящий звонок — до 5 активных рабочих минут.`,next:`Связь прервалась или консультация не завершена → «В работе». Полная консультация → «Принимают решение» или следующий фактический этап. Три безответные попытки звонка и одно сообщение клиенту → «Недозвон».`,mentorId:`ilya`,mentorNote:`Первый звонок — в течение 5 активных рабочих минут. Нет ответа — повтори через 10 минут и ещё раз через час.`,keyPoint:`Не ждём: первая задача — позвонить клиенту сейчас.`},{code:`ST02`,label:`В работе`,when:`Контакт был, но консультация ещё не завершена.`,sla:`Заверши консультацию за 48 рабочих часов, если нет точного времени.`,next:`Консультация завершена → «Принимают решение». Нет результата после трёх возвратов за два рабочих дня → система заберёт сделку и переведёт её в тёплый пул, где её возьмёт другой МПП.`,mentorId:`svetlana`,mentorNote:`Связь оборвалась — это «В работе». Вернись к клиенту с сохранённого места и закончи консультацию за 48 рабочих часов.`,keyPoint:`Не начинай разговор заново: продолжай с первого незаполненного вопроса Обнулятора.`},{code:`ST04`,label:`Принимают решение`,when:`Цена и решение озвучены; есть барьер или клиент готов действовать.`,sla:`Три рабочих дня на подпись или точную договорённость. Каждый день — одно содержательное касание. Нет подписи и точной даты → система заберёт сделку и переведёт её в тёплый пул, где её возьмёт другой МПП.`,next:`Подписал договор → «Договор подписан»; оплатил → фактический этап оплаты; нет подписи и точной даты за три рабочих дня → система заберёт сделку, переведёт её в тёплый пул, где её возьмёт другой МПП.`,mentorId:`evgeniy`,mentorNote:`Поторопись: у тебя три рабочих дня, чтобы помочь клиенту подписать договор кодом из SMS. Нет подписи и точной даты следующего шага — система заберёт сделку; в тёплом пуле её возьмёт другой МПП.`,keyPoint:`Подписание — только кодом из SMS. Каждый день — одно содержательное касание с результатом.`},{code:`ST06`,label:`Договор подписан`,when:`Сервис подтвердил подпись актуального договора.`,sla:`Дни 1–3 — касание ежедневно; затем — раз в 48 рабочих часов.`,next:`Частичный первый платёж → «Частичный платёж». Полный первый платёж → «Полная оплата».`,mentorId:`nikita`,mentorNote:`Договор уже подписан: первые три рабочих дня связывайся с клиентом каждый день, затем — раз в 48 рабочих часов.`,keyPoint:`На 7-й день руководитель отдела продаж проверяет сделку.`},{code:`ST07`,label:`Частичный платёж`,when:`Подтверждено от 1 000 ₽ до полного первого платежа по тарифу.`,sla:`Не начинай касания заново: продолжай со следующего шага. После третьего касания — раз в 48 рабочих часов.`,next:`Накоплена полная сумма первого платежа → «Полная оплата».`,mentorId:`alena`,mentorNote:`Есть часть оплаты: подтверди сумму и продолжай с того касания, на котором клиент оплатил. Цикл не начинается заново.`,keyPoint:`На 14-й день руководитель отдела продаж проверяет сделку.`},{code:`ST08`,label:`Полная оплата`,when:`Подтверждён полный первый платёж по тарифу.`,sla:`Сопровождение должно принять передачу за 30 рабочих минут.`,next:`Сопровождение подтвердило приём сделки → сделка выходит из продаж.`,mentorId:`victoria`,mentorNote:`Полная оплата получена. Передай сделку в сопровождение в течение 30 рабочих минут.`,keyPoint:`Сопровождение приняло сделку — только после этого клиент выходит из твоей работы.`}],re=[`Воронка`,`Долги и расчёт`,`Условия и кнопка`,`Д0–Д3`,`После результата`,`Тест`],ie=[{question:`Новый лид назначен. Когда нужен первый исходящий звонок?`,options:[`До конца рабочего дня`,`В течение 5 активных рабочих минут`,`В течение 30 рабочих минут`],correctIndex:1,feedback:`Первый исходящий звонок по новому лиду — до 5 активных рабочих минут.`},{question:`Клиент ответил, но связь оборвалась до завершения консультации. Какой этап ставим?`,options:[`Новый лид`,`В работе`,`Принимают решение`],correctIndex:1,feedback:`Контакт уже был, но консультация не завершена — это этап «В работе».`},{question:`В «Принимают решение» прошло три рабочих дня: нет подписи и точной договорённости. Что дальше?`,options:[`Продолжать обычные касания в этом этапе`,`Система заберёт сделку, переведёт в тёплый пул — там её возьмёт другой МПП`,`Перевести в «Договор подписан»`],correctIndex:1,feedback:`Без подписи и точной даты за три рабочих дня система сама заберёт сделку, переведёт её в тёплый пул, где с ней продолжит другой МПП. Поэтому не жди.`},{question:`Клиент пока не готов и не знает ФИО или дату первого платежа, но сумма долга уже внесена. Что нажать в Обнуляторе?`,options:[`✍ Подписать договор`,`🤔 Думает · отправить`,`₽ Отправить ссылку на оплату`],correctIndex:1,feedback:`Если клиент не готов или данных не хватает, нажимаем «🤔 Думает · отправить».`},{question:`Кто на старте обзванивает тёплый пул?`,options:[`Стажёры, менеджеры с конверсией менее 10% и менеджеры без текущих задач`,`Только руководитель отдела продаж`,`Только менеджер, который вёл сделку раньше`],correctIndex:0,feedback:`На старте пул обзванивают стажёры, менеджеры с конверсией менее 10% и менеджеры без текущих задач.`},{question:`Что нужно сделать во второй рабочий день в «Принимают решение»?`,options:[`Презентовать юридическое заключение и получить оплату`,`Сразу перевести сделку в тёплый пул`,`Предложить скидку на следующий день`],correctIndex:0,feedback:`Во второй рабочий день презентуй юридическое заключение и веди клиента к оплате. Если кредитной истории ещё нет — дай предварительное заключение и помоги её получить.`},{question:`Что предлагаешь в третий рабочий день, если полной оплаты ещё нет?`,options:[`Скидку 10 000 ₽ за полную оплату сегодня — завтра она уже не действует`,`Скидку за обещание оплатить на следующей неделе`,`Любую скидку за частичную оплату`],correctIndex:0,feedback:`Скидка 10 000 ₽ действует только за полную оплату сегодня, до 23:59. На следующий день она не переносится.`},{question:`Договор подтверждённо подписан. Как часто нужно касаться клиента в первые три рабочих дня?`,options:[`Раз в 48 рабочих часов`,`Каждый рабочий день`,`Только если клиент сам написал`],correctIndex:1,feedback:`После подписи в первые три рабочих дня обязательное касание — каждый рабочий день.`},{question:`Что считается точной договорённостью с клиентом?`,options:[`«Созвонимся позже»`,`Дата, время, действие и канал`,`Только дата платежа`],correctIndex:1,feedback:`Точная договорённость = дата + время + действие + канал. Она заменяет ближайшее обычное касание.`},{question:`Обязательное касание после подписи не выполнено по регламенту. Что произойдёт?`,options:[`Сделку передадут другому менеджеру`,`Клиент автоматически уйдёт в тёплый пул`,`Достаточно оставить комментарий в сделке`],correctIndex:0,feedback:`Пропуск обязательного касания не отправляет клиента в тёплый пул, но сделку передадут другому менеджеру.`}],ae=[{timing:`Касание 1 · сразу после подписи`,title:`Юридическое заключение и документы`,description:`Есть кредитная история — разберите её и презентуйте юридическое заключение. Нет — дайте предварительное заключение со слов, снова запросите КИ и сразу запросите нужные документы.`,next:`Цель: оплата или точные дата, время и сумма. Нет результата — следующее касание в рабочий день.`},{timing:`Касание 2 · следующий рабочий день`,title:`Скидка за полную оплату сегодня`,description:`Предложи 10 000 ₽ только если клиент полностью оплачивает договор сегодня. Скидка действует до 23:59, не переносится и повторно не включается. Напомни о недостающих КИ и документах.`,next:`Цель: полная оплата сегодня или точные дата, время и сумма.`},{timing:`Касание 3 · ещё на следующий рабочий день`,title:`Документы и дорожная карта`,description:`Проверь документы, назови недостающее и помоги понять, где это получить. Разбери дорожную карту: что делаем, в каком порядке и какой ближайший шаг.`,next:`Цель: оплата или точные дата, время и сумма. Нет результата — следующий шаг через 48 рабочих часов.`},{timing:`Касание 4 · через 48 рабочих часов`,title:`Похожий кейс и рекомендация`,description:`Покажи похожий случай и его результат для ситуации клиента. Возьми рекомендацию у клиента и направь ему карточку по рекомендации.`,next:`После кейса и карточки по рекомендации снова веди клиента к оплате.`},{timing:`Касание 5 · ещё через 48 рабочих часов`,title:`Прямой эфир и повторное закрытие`,description:`Позвони, уточни, был ли клиент на нашем прямом эфире, и предложи попасть на следующий. Ещё раз вернись к его болям и попробуй получить оплату раньше.`,next:`Не останавливайся на приглашении на эфир: снова закрой клиента на оплату раньше.`},{timing:`Касание 6 и далее · каждые 48 рабочих часов`,title:`Материал по боли клиента`,description:`Сначала обязательно позвони. Если не дозвонился — отправь один материал: отзыв, статистику по списанию долгов в России за последний год, видео «Банкротство за 10 минут» или видео от собственника по боли клиента.`,next:`Шаблон сообщения: «Иван, подумал о вас, когда наткнулся на этот материал. Решил прислать, думаю, что вам откликнется) Как посмотрите — напишите мне своё мнение, буду рад. И подскажите, на 14-е всё в силе у нас?»`}],oe=[{timing:`Касание 1 · если оплата пришла до первого касания`,title:`Подтверди часть оплаты`,description:`Подтверди деньги и назови остаток. Разбери КИ и юридическое заключение либо дай предварительное заключение, затем запроси нужные документы.`,next:`Цель: закрыть остаток или получить точные дата, время и сумму доплаты.`},{timing:`Касание 2 · следующий рабочий день`,title:`Скидка за полную доплату сегодня`,description:`Предложи 10 000 ₽ только если клиент полностью закрывает оставшуюся сумму сегодня. Скидка действует до 23:59 и не переносится.`,next:`Цель: полная доплата сегодня или точная договорённость.`},{timing:`Касание 3 · ещё на следующий рабочий день`,title:`Документы и дорожная карта`,description:`Проверь документы, помоги получить недостающее, разберись с клиентом в дорожной карте и ближайшем шаге.`,next:`Цель: закрыть остаток или получить точные дата, время и сумму. Нет результата — следующий шаг через 48 рабочих часов.`},{timing:`Касание 4 · через 48 рабочих часов`,title:`Похожий кейс и рекомендация`,description:`Покажи похожий случай и его результат для ситуации клиента. Возьми рекомендацию у клиента и направь ему карточку по рекомендации.`,next:`После кейса и карточки по рекомендации снова веди клиента к полной доплате.`},{timing:`Касание 5 · ещё через 48 рабочих часов`,title:`Прямой эфир и повторное закрытие`,description:`Позвони, уточни, был ли клиент на нашем прямом эфире, и предложи попасть на следующий. Ещё раз вернись к его болям и попробуй закрыть остаток раньше.`,next:`Не останавливайся на приглашении на эфир: снова закрой клиента на полную доплату раньше.`},{timing:`Касание 6 и далее · каждые 48 рабочих часов`,title:`Материал по боли клиента`,description:`Сначала обязательно позвони. Если не дозвонился — отправь один материал: отзыв, с
